name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - desktop/package.json
      - .github/workflows/release.yml

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-windows:
    name: Build and publish Windows packages
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    env:
      CARGO_HTTP_TIMEOUT: 120
      CARGO_NET_RETRY: 10
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if (-not $version) { throw 'desktop/package.json version is empty.' }
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check existing release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($exists) { Write-Host "Release $env:RELEASE_TAG already exists." }

      - name: Set up Node.js
        if: steps.release.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        if: steps.release.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        if: steps.release.outputs.exists != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install frontend dependencies
        if: steps.release.outputs.exists != 'true'
        run: npm ci

      - name: Build portable executable and NSIS installer
        if: steps.release.outputs.exists != 'true'
        run: npm run release:installer

      - name: Publish GitHub release
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $releaseDir = Join-Path 'releases' $env:RELEASE_TAG
          $assets = @(Get-ChildItem -LiteralPath $releaseDir -Filter '*.exe' -File | ForEach-Object FullName)
          if (!(Test-Path -LiteralPath (Join-Path $releaseDir 'typing-cat.exe')) -or $assets.Count -lt 2) {
            throw 'Expected both the portable executable and the Windows installer.'
          }
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "Typing Cat $env:RELEASE_TAG" --generate-notes
          exit $LASTEXITCODE
