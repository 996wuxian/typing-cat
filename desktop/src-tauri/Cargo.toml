[package]
name = "typing-cat"
version = "1.0.2"
description = "Interactive typing cat"
edition = "2021"

[[bin]]
name = "typing-cat-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
